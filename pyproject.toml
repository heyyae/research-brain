[project]
name = "research-brain"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.scripts]
research-brain = "research_brain.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_brain"]
